<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img"><title>With a class per kind of thing, a defender that shoots and makes gold has no good place in the tree</title><rect width="720" height="320" rx="10" fill="#22262b"/>
<line x1="250" y1="78" x2="110" y2="122" stroke="#565d65" stroke-width="1.5" stroke-linecap="round"/>
<line x1="250" y1="78" x2="250" y2="122" stroke="#565d65" stroke-width="1.5" stroke-linecap="round"/>
<line x1="250" y1="78" x2="390" y2="122" stroke="#565d65" stroke-width="1.5" stroke-linecap="round"/>
<rect x="194" y="42" width="112" height="36" fill="#2e3338" rx="6" stroke="#565d65" stroke-width="1.5"/>
<text x="250" y="65" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dee2e6" text-anchor="middle" font-weight="bold">Defender</text>
<rect x="54" y="122" width="112" height="36" fill="#2e3338" rx="6" stroke="#565d65" stroke-width="1.5"/>
<text x="110" y="145" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dee2e6" text-anchor="middle" font-weight="bold">Chest</text>
<text x="110" y="178" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">makes gold</text>
<rect x="194" y="122" width="112" height="36" fill="#2e3338" rx="6" stroke="#565d65" stroke-width="1.5"/>
<text x="250" y="145" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dee2e6" text-anchor="middle" font-weight="bold">Archer</text>
<text x="250" y="178" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">shoots</text>
<rect x="334" y="122" width="112" height="36" fill="#2e3338" rx="6" stroke="#565d65" stroke-width="1.5"/>
<text x="390" y="145" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dee2e6" text-anchor="middle" font-weight="bold">Knight</text>
<text x="390" y="178" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">blocks</text>
<rect x="524" y="42" width="112" height="36" fill="#2e3338" rx="6" stroke="#565d65" stroke-width="1.5"/>
<text x="580" y="65" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dee2e6" text-anchor="middle" font-weight="bold">Goblin</text>
<text x="580" y="98" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">has its own health</text>
<rect x="124" y="216" width="172" height="40" fill="#14171a" rx="6" stroke="#d45d35" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="210" y="241" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#d45d35" text-anchor="middle" font-weight="normal">shoots and makes gold?</text>
<line x1="110" y1="190" x2="180" y2="216" stroke="#d45d35" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="250" y1="190" x2="240" y2="216" stroke="#d45d35" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="322" y="224" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">one base class only: the</text>
<text x="322" y="240.9" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">other ability gets copied</text>
<rect x="494" y="216" width="172" height="40" fill="#14171a" rx="6" stroke="#d45d35" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="580" y="241" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#d45d35" text-anchor="middle" font-weight="normal">a shield, like a defender?</text>
<line x1="580" y1="110" x2="580" y2="216" stroke="#d45d35" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="360" y="296" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">Inheritance says what a thing is. Here it matters more what each thing can do.</text>
</svg>
