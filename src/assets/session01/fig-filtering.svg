<text x="575" y="268" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">SamplerState.LinearClamp</text>
<text x="360" y="302" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">Each screen pixel takes the nearest art pixel, or a mix of the ones around it.</text>
