<text x="301" y="246" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2aa6a6" text-anchor="middle" font-weight="bold">Point</text>
<text x="301" y="268" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">SamplerState.PointClamp</text>
<rect x="450" y="44" width="250" height="172" fill="#14171a" rx="6" stroke="#d45d35" stroke-width="1.5"/>
