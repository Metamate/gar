<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img"><title>MonoGame calls Initialize and LoadContent once, then Update and Draw every frame</title><defs><marker id="arrow-9aa3ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ab"/></marker><marker id="arrow-2aa6a6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2aa6a6"/></marker><marker id="arrow-d45d35" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d45d35"/></marker></defs><rect width="720" height="380" rx="10" fill="#22262b"/>
<rect x="60" y="50" width="150" height="54" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="135" y="82.25" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="middle" font-weight="bold">Initialize()</text>
<rect x="270" y="50" width="150" height="54" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="345" y="82.25" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="middle" font-weight="bold">LoadContent()</text>
<line x1="214" y1="77" x2="264" y2="77" stroke="#9aa3ab" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<text x="240" y="36" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">once, at the start</text>
<rect x="180" y="140" width="330" height="216" fill="#14171a" rx="10" stroke="#2aa6a6" stroke-width="1.5"/>
<text x="196" y="164" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2aa6a6" text-anchor="start" font-weight="normal">the game loop</text>
<rect x="270" y="180" width="150" height="50" fill="#2e3338" rx="8" stroke="#2aa6a6" stroke-width="2"/>
<text x="345" y="210.25" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="middle" font-weight="bold">Update()</text>
<rect x="270" y="290" width="150" height="50" fill="#2e3338" rx="8" stroke="#2aa6a6" stroke-width="2"/>
<text x="345" y="320.25" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="middle" font-weight="bold">Draw()</text>
<line x1="345" y1="108" x2="345" y2="174" stroke="#9aa3ab" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<line x1="345" y1="234" x2="345" y2="284" stroke="#2aa6a6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-2aa6a6)"/>
<path d="M266 315 C 206 315, 206 205, 264 205" stroke="#2aa6a6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2aa6a6)"/>
<text x="430" y="266" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2aa6a6" text-anchor="start" font-weight="normal">every frame</text>
<rect x="560" y="180" width="120" height="50" fill="#2e3338" rx="8" stroke="#d45d35" stroke-width="2"/>
<text x="620" y="210.25" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#d45d35" text-anchor="middle" font-weight="bold">Exit()</text>
<line x1="424" y1="205" x2="554" y2="205" stroke="#d45d35" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-d45d35)" stroke-dasharray="5 4"/>
<text x="620" y="252" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">when the game</text>
<text x="620" y="270" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">is closed</text>
<text x="470" y="60" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">Game1 overrides these four</text>
<text x="470" y="76.9" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">methods. MonoGame decides</text>
<text x="470" y="93.8" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">when to call them.</text>
</svg>
