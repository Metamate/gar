<text x="576" y="106" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9aa3ab" text-anchor="start" font-weight="normal">bars at the sides</text>
<rect x="262" y="185" width="200" height="160" fill="#000000" stroke="#565d65" stroke-width="1.5"/>
