<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img"><title>Every game runs the same loop: process input, update the game, render, and again</title><defs><marker id="arrow-9aa3ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ab"/></marker><marker id="arrow-2aa6a6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2aa6a6"/></marker></defs><rect width="720" height="250" rx="10" fill="#22262b"/>
<rect x="60" y="80" width="170" height="70" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="145" y="120.95" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#dee2e6" text-anchor="middle" font-weight="bold">Process input</text>
<text x="145" y="176" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">what did the player do?</text>
<line x1="236" y1="115" x2="269" y2="115" stroke="#9aa3ab" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="275" y="80" width="170" height="70" fill="#2e3338" rx="8" stroke="#d45d35" stroke-width="2"/>
<text x="360" y="120.95" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#dee2e6" text-anchor="middle" font-weight="bold">Update</text>
<text x="360" y="176" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">move the world one step on</text>
<line x1="451" y1="115" x2="484" y2="115" stroke="#9aa3ab" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="490" y="80" width="170" height="70" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="575" y="120.95" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#dee2e6" text-anchor="middle" font-weight="bold">Render</text>
<text x="575" y="176" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">draw what the world looks like</text>
<path d="M664 115 C 712 115, 712 34, 600 34 L 120 34 C 14 34, 14 115, 54 115" stroke="#2aa6a6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2aa6a6)"/>
<text x="360" y="24" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2aa6a6" text-anchor="middle" font-weight="normal">many times a second, until the game ends</text>
<text x="360" y="226" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">The loop never waits for the player. The game keeps moving when nobody presses anything.</text>
</svg>
