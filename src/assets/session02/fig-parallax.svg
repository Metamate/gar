<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img"><title>Layers that scroll at different speeds look like they are at different distances</title><defs><marker id="arrow-2aa6a6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2aa6a6"/></marker><marker id="arrow-d45d35" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d45d35"/></marker></defs><rect width="720" height="400" rx="10" fill="#22262b"/>
<rect x="40" y="50" width="400" height="225" fill="#14171a"/>
<image x="40" y="50" width="400" height="209" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<image x="40" y="259" width="400" height="16" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAAQCAYAAAA4eCmgAAAAg0lEQVR4nO3buwmAQBAE0D2xPEMDA0uxHENDi7EbjY3kJpT3sgM/ILrDcNiWa74LADoNvScAgAABIKaBABBpx1b2QADopoEAEBEgAEQECACR8euA/Xyv1ym7ket7Pt4f35f5UL+anxoIABEBAkBEgAAQ8R8IABENBICIAAEgIkAAqMQDqQ0o8bcDutkAAAAASUVORK5CYII="/>
<image x="190" y="140" width="36" height="24" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="40" y="50" width="400" height="225" fill="none" stroke="#565d65" stroke-width="1.5"/>
<text x="40" y="36" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9aa3ab" text-anchor="start" font-weight="normal">the screen</text>
<line x1="550" y1="110" x2="500" y2="110" stroke="#2aa6a6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-2aa6a6)"/>
<text x="460" y="86" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="start" font-weight="bold">background</text>
<text x="562" y="115" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="14" fill="#2aa6a6" text-anchor="start" font-weight="normal">30 px/s</text>
<text x="460" y="140" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">far away, so it moves slowly</text>
<text x="460" y="178" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="start" font-weight="bold">bird</text>
<text x="460" y="200" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">never moves sideways</text>
<line x1="590" y1="258" x2="500" y2="258" stroke="#d45d35" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-d45d35)"/>
<text x="460" y="236" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="start" font-weight="bold">ground</text>
<text x="602" y="263" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="14" fill="#d45d35" text-anchor="start" font-weight="normal">60 px/s</text>
<text x="460" y="288" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">close, so it moves fast</text>
<line x1="448" y1="110" x2="456" y2="110" stroke="#565d65" stroke-width="1.5" stroke-linecap="round"/>
<line x1="448" y1="152" x2="456" y2="174" stroke="#565d65" stroke-width="1.5" stroke-linecap="round"/>
