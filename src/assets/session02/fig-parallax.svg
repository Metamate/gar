<rect x="120" y="304" width="200" height="20" fill="#2e3338" stroke="#2aa6a6" stroke-width="1.5"/>
<rect x="320" y="304" width="200" height="20" fill="#2e3338" stroke="#2aa6a6" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="220" y="319" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">the image</text>
<text x="420" y="319" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">the same image again</text>
<rect x="240" y="298" width="130" height="32" fill="none" stroke="#dee2e6" stroke-width="2"/>
<text x="305" y="348" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#dee2e6" text-anchor="middle" font-weight="normal">the screen</text>
<text x="120" y="374" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">offset = (offset + speed × deltaTime) % loopingPoint</text>
<text x="540" y="320" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">at the looping point,</text>
<text x="540" y="338" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">the offset starts over</text>
</svg>
