<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"><title>Every change to a program goes through the same four steps, and architecture shortens the second</title><defs><marker id="arrow-9aa3ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ab"/></marker></defs><rect width="720" height="330" rx="10" fill="#22262b"/>
<rect x="250" y="40" width="220" height="64" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="360" y="68" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#dee2e6" text-anchor="middle" font-weight="bold">Get a problem</text>
<text x="360" y="88" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">a feature, or a bug</text>
<rect x="480" y="135" width="220" height="64" fill="#2e3338" rx="8" stroke="#d45d35" stroke-width="2"/>
<text x="590" y="163" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d45d35" text-anchor="middle" font-weight="bold">Learn the code</text>
<text x="590" y="183" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">find what the change touches</text>
<rect x="250" y="230" width="220" height="64" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="360" y="258" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#dee2e6" text-anchor="middle" font-weight="bold">Write the solution</text>
<text x="360" y="278" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">the part that feels like work</text>
<rect x="20" y="135" width="220" height="64" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="130" y="163" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#dee2e6" text-anchor="middle" font-weight="bold">Clean up</text>
<text x="130" y="183" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">so the next change is easy too</text>
<path d="M474 72 C 560 72, 590 100, 590 130" stroke="#9aa3ab" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-9aa3ab)"/>
<path d="M590 204 C 590 240, 560 262, 476 262" stroke="#9aa3ab" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-9aa3ab)"/>
<path d="M244 262 C 160 262, 130 240, 130 204" stroke="#9aa3ab" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-9aa3ab)"/>
<path d="M130 130 C 130 100, 160 72, 244 72" stroke="#9aa3ab" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-9aa3ab)"/>
<text x="360" y="158" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">Good architecture means</text>
<text x="360" y="178" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">less code to learn</text>
<text x="360" y="198" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">before each change.</text>
</svg>
