<rect x="46" y="166" width="68" height="68" fill="none" stroke="#565d65" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="58" y="178" width="44" height="44" fill="none" stroke="#2aa6a6" stroke-width="2.5" transform="rotate(25 80 200)"/>
<text x="180" y="268" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">a rough box around each shape,</text>
<text x="180" y="285.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">and only one pair of boxes overlaps</text>
<line x1="346" y1="145" x2="374" y2="145" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<text x="540" y="36" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#dee2e6" text-anchor="middle" font-weight="bold">2. Narrow phase</text>
<rect x="380" y="50" width="320" height="190" fill="#14171a" rx="6"/>
<rect x="428" y="90" width="44" height="44" fill="none" stroke="#2aa6a6" stroke-width="2.5" transform="rotate(25 450 112)"/>
