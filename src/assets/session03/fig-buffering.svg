<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"><title>Two key presses between ticks: without a buffer the first is lost, with one both are used</title><rect width="720" height="330" rx="10" fill="#22262b"/>
<text x="190" y="36" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9aa3ab" text-anchor="start" font-weight="normal">the snake moves right; the player presses Up, then Left, before the next tick</text>
<text x="30" y="120" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#dee2e6" text-anchor="start" font-weight="bold">Snake6</text>
<text x="30" y="140" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">one wanted direction</text>
