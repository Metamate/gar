<line x1="590" y1="112" x2="590" y2="136" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round"/>
<text x="590" y="154" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">tick</text>
<rect x="250" y="74" width="44" height="26" fill="#2e3338" rx="13"/>
<text x="272" y="91.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">Up</text>
<line x1="272" y1="100" x2="272" y2="120" stroke="#9aa3ab" stroke-width="1.5" stroke-linecap="round"/>
<rect x="310" y="74" width="52" height="26" fill="#2e3338" rx="13"/>
<text x="336" y="91.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">Left</text>
<line x1="336" y1="100" x2="336" y2="120" stroke="#9aa3ab" stroke-width="1.5" stroke-linecap="round"/>
<text x="400" y="108" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#d45d35" text-anchor="start" font-weight="bold">turns Left: into its own neck</text>
<line x1="250" y1="86" x2="294" y2="86" stroke="#d45d35" stroke-width="2" stroke-linecap="round"/>
<text x="302" y="66" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#d45d35" text-anchor="start" font-weight="normal">overwritten</text>
