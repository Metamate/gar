<text x="30" y="264" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="start" font-weight="normal">a queue of turns</text>
<line x1="190" y1="248" x2="650" y2="248" stroke="#565d65" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="236" x2="190" y2="260" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round"/>
