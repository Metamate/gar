<text x="336" y="215.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">Left</text>
<line x1="336" y1="224" x2="336" y2="244" stroke="#9aa3ab" stroke-width="1.5" stroke-linecap="round"/>
