<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img"><title>The history only knows that a command can be executed and undone; each command knows what it acts on</title><defs><marker id="arrow-9aa3ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ab"/></marker><marker id="arrow-d45d35" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d45d35"/></marker></defs><rect width="720" height="290" rx="10" fill="#22262b"/>
<text x="360" y="40" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">The history can run, undo and redo any command without knowing what it does.</text>
<rect x="30" y="90" width="160" height="64" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="2"/>
<text x="110" y="118.5" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dee2e6" text-anchor="middle" font-weight="bold">CommandHistory</text>
<text x="110" y="136" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9aa3ab" text-anchor="middle" font-weight="normal">the invoker</text>
<line x1="194" y1="122" x2="264" y2="122" stroke="#9aa3ab" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="270" y="86" width="170" height="72" fill="#14171a" rx="8" stroke="#2aa6a6" stroke-width="1.5"/>
<text x="355" y="112" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="15" fill="#2aa6a6" text-anchor="middle" font-weight="bold">ICommand</text>
<text x="355" y="136" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">Execute()  Undo()</text>
<line x1="355" y1="158" x2="355" y2="196" stroke="#565d65" stroke-width="1.5" stroke-linecap="round"/>
<rect x="270" y="196" width="170" height="56" fill="#2e3338" rx="8" stroke="#565d65" stroke-width="1.5"/>
<text x="355" y="220" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="14" fill="#dee2e6" text-anchor="middle" font-weight="normal">MoveCommand</text>
<text x="355" y="240" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">level, direction, result</text>
<line x1="444" y1="224" x2="606" y2="160" stroke="#d45d35" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-d45d35)"/>
<rect x="540" y="90" width="150" height="64" fill="#2e3338" rx="8" stroke="#d45d35" stroke-width="2"/>
<text x="615" y="118.5" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#d45d35" text-anchor="middle" font-weight="bold">Level</text>
<text x="615" y="136" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9aa3ab" text-anchor="middle" font-weight="normal">the receiver</text>
<text x="560" y="222" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12.5" fill="#d45d35" text-anchor="start" font-weight="normal">level.Move(direction)</text>
</svg>
