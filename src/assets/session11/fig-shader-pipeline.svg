<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img"><title>The graphics pipeline: vertices go in, the two shaders run, and pixels come out</title><defs><marker id="arrow-9aa3ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ab"/></marker></defs><rect width="720" height="290" rx="10" fill="#22262b"/>
<rect x="20" y="50" width="120" height="110" fill="#14171a" rx="8" stroke="#565d65" stroke-width="1.5"/>
<text x="80" y="82" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#dee2e6" text-anchor="middle" font-weight="bold">Vertices</text>
<text x="80" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">the corners of</text>
<text x="80" y="130" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">every sprite</text>
<line x1="142" y1="105" x2="157" y2="105" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="160" y="50" width="120" height="110" fill="#14171a" rx="8" stroke="#2aa6a6" stroke-width="1.5"/>
<text x="220" y="82" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2aa6a6" text-anchor="middle" font-weight="bold">Vertex shader</text>
<text x="220" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">once per vertex</text>
<text x="220" y="130" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">where on screen?</text>
<line x1="282" y1="105" x2="297" y2="105" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="300" y="50" width="120" height="110" fill="#14171a" rx="8" stroke="#565d65" stroke-width="1.5"/>
<text x="360" y="82" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#dee2e6" text-anchor="middle" font-weight="bold">Rasteriser</text>
<text x="360" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">which pixels does</text>
<text x="360" y="130" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">each triangle cover?</text>
<line x1="422" y1="105" x2="437" y2="105" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="440" y="50" width="120" height="110" fill="#14171a" rx="8" stroke="#d45d35" stroke-width="1.5"/>
<text x="500" y="82" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#d45d35" text-anchor="middle" font-weight="bold">Pixel shader</text>
<text x="500" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">once per pixel</text>
<text x="500" y="130" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">which colour?</text>
<line x1="562" y1="105" x2="577" y2="105" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="580" y="50" width="120" height="110" fill="#14171a" rx="8" stroke="#565d65" stroke-width="1.5"/>
<text x="640" y="82" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#dee2e6" text-anchor="middle" font-weight="bold">The screen</text>
<text x="640" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">or a render</text>
<text x="640" y="130" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">target</text>
<rect x="440" y="200" width="120" height="44" fill="#14171a" rx="8" stroke="#565d65" stroke-width="1.5"/>
<text x="500" y="227" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">a texture</text>
<line x1="500" y1="196" x2="500" y2="166" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<text x="30" y="220" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">The two coloured stages are the ones you write, in HLSL.</text>
<text x="30" y="242" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">The GPU runs thousands of them at the same time.</text>
</svg>
