<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img"><title>The tile position jumps at once; the pixel position is tweened to catch up</title><defs><marker id="arrow-2aa6a6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2aa6a6"/></marker></defs><rect width="720" height="320" rx="10" fill="#22262b"/>
<rect x="60" y="70" width="70" height="70" fill="#2a3a2a" stroke="#565d65" stroke-width="1"/>
<text x="95" y="160" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">tile 3</text>
<rect x="130" y="70" width="70" height="70" fill="#2a3a2a" stroke="#565d65" stroke-width="1"/>
<text x="165" y="160" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">tile 4</text>
<rect x="200" y="70" width="70" height="70" fill="#2a3a2a" stroke="#565d65" stroke-width="1"/>
<text x="235" y="160" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">tile 5</text>
<rect x="270" y="70" width="70" height="70" fill="#2a3a2a" stroke="#565d65" stroke-width="1"/>
<text x="305" y="160" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="12" fill="#9aa3ab" text-anchor="middle" font-weight="normal">tile 6</text>
<rect x="148" y="82" width="34" height="46" fill="#b5b0dd" opacity="0.25"/>
<rect x="171.1" y="82" width="34" height="46" fill="#b5b0dd" opacity="0.5"/>
<rect x="194.2" y="82" width="34" height="46" fill="#b5b0dd" opacity="0.75"/>
<rect x="218" y="82" width="34" height="46" fill="#b5b0dd" opacity="1"/>
<line x1="165" y1="54" x2="235" y2="54" stroke="#2aa6a6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-2aa6a6)"/>
<text x="200" y="44" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2aa6a6" text-anchor="middle" font-weight="normal">the sprite: tweened over half a second</text>
<rect x="203" y="73" width="64" height="64" fill="none" rx="4" stroke="#d45d35" stroke-width="2.5"/>
<text x="390" y="78" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="15" fill="#d45d35" text-anchor="start" font-weight="bold">MapX, MapY</text>
<text x="390" y="102" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">the tile the player is on: used for the</text>
<text x="390" y="119.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">rules, and set at once when a step starts</text>
<text x="390" y="164" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="15" fill="#2aa6a6" text-anchor="start" font-weight="bold">X, Y</text>
<text x="390" y="188" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">where the sprite is drawn: in pixels,</text>
<text x="390" y="205.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">sliding from the old tile to the new one</text>
<text x="360" y="258" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">The logic moves first. When the sprite arrives, the walk state checks for an encounter,</text>
<text x="360" y="278" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">and takes another step if a direction is still held.</text>
</svg>
