<text x="360" y="212" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">Textures and references to other objects are left out: they are rebuilt from the data.</text>
<text x="360" y="234" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">A round-trip test saves, loads, and checks that the two records are equal.</text>
