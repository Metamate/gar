<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"><title>Coyote time allows a jump for a moment after the player has left the ground</title><rect width="720" height="300" rx="10" fill="#22262b"/>
<rect x="30" y="40" width="660" height="190" fill="#1b2733" rx="4"/>
<rect x="30" y="150" width="60" height="60" fill="#8a5a3c"/>
<rect x="30" y="150" width="60" height="16.8" fill="#6fbf4a"/>
<rect x="30" y="150" width="60" height="60" fill="none" stroke="#00000055" stroke-width="1"/>
<rect x="90" y="150" width="60" height="60" fill="#8a5a3c"/>
<rect x="90" y="150" width="60" height="16.8" fill="#6fbf4a"/>
<rect x="90" y="150" width="60" height="60" fill="none" stroke="#00000055" stroke-width="1"/>
<rect x="150" y="150" width="60" height="60" fill="#8a5a3c"/>
