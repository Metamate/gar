<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"><title>The hitbox deals damage and the hurtbox receives it, and neither has to match the sprite</title><rect width="720" height="330" rx="10" fill="#22262b"/>
<rect x="30" y="50" width="400" height="230" fill="#c98d5a" rx="4" opacity="0.9"/>
<rect x="110" y="110" width="64" height="96" fill="#6fbf4a" opacity="0.55"/>
<text x="142" y="100" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1c2a14" text-anchor="middle" font-weight="normal">the sprite</text>
<rect x="110" y="158" width="64" height="48" fill="none" stroke="#7fd46b" stroke-width="3"/>
<rect x="174" y="146" width="44" height="64" fill="none" stroke="#d45d35" stroke-width="3"/>
<line x1="170" y1="172" x2="214" y2="172" stroke="#dfe6ea" stroke-width="5" stroke-linecap="round"/>
<rect x="196" y="150" width="60" height="60" fill="#b98ad6" opacity="0.75"/>
<rect x="196" y="150" width="60" height="60" fill="none" stroke="#7fd46b" stroke-width="3"/>
<rect x="196" y="150" width="12" height="50" fill="#d45d35" opacity="0.35"/>
<text x="226" y="230" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3a2a18" text-anchor="middle" font-weight="normal">an enemy</text>
<rect x="460" y="74" width="18" height="18" fill="none" stroke="#d45d35" stroke-width="3"/>
<text x="490" y="89" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d45d35" text-anchor="start" font-weight="bold">hitbox</text>
<text x="460" y="116" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">the area that deals damage:</text>
<text x="460" y="133.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">a rectangle in front of the</text>
<text x="460" y="151.1" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">player, while the sword swings</text>
<rect x="460" y="196" width="18" height="18" fill="none" stroke="#7fd46b" stroke-width="3"/>
<text x="490" y="211" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7fd46b" text-anchor="start" font-weight="bold">hurtbox</text>
<text x="460" y="238" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">the area that takes damage:</text>
<text x="460" y="255.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">the hero's feet, the enemy's body</text>
<text x="230" y="308" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="middle" font-weight="normal">They overlap, so the enemy is hit. Press F1 in the game to see both.</text>
</svg>
