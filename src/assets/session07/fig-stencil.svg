<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"><title>Three passes: draw the rooms, mark the door arches in the stencil buffer, then draw the player where it is unmarked</title><defs><marker id="arrow-9aa3ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ab"/></marker></defs><rect width="720" height="300" rx="10" fill="#22262b"/>
<rect x="30" y="70" width="200" height="130" fill="#c98d5a" opacity="0.9"/>
<rect x="30" y="70" width="200" height="130" fill="none" stroke="#5b4a3a" stroke-width="10"/>
<rect x="222" y="113" width="16" height="44" fill="#3a2f26"/>
<text x="130" y="44" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="middle" font-weight="bold">1. The rooms</text>
<text x="130" y="228" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">everything except</text>
<text x="130" y="244.9" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">the player</text>
<rect x="260" y="70" width="200" height="130" fill="#14171a"/>
<rect x="438" y="111" width="30" height="48" fill="#dee2e6"/>
<text x="430" y="140" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="15" fill="#dee2e6" text-anchor="end" font-weight="normal">1</text>
<text x="300" y="140" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="15" fill="#9aa3ab" text-anchor="start" font-weight="normal">0</text>
<text x="360" y="44" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="middle" font-weight="bold">2. The stencil</text>
<text x="360" y="228" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">a rectangle over each arch,</text>
<text x="360" y="244.9" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9aa3ab" text-anchor="middle" font-weight="normal">written as 1, with no colour</text>
<rect x="490" y="70" width="200" height="130" fill="#c98d5a" opacity="0.9"/>
<rect x="490" y="70" width="200" height="130" fill="none" stroke="#5b4a3a" stroke-width="10"/>
<rect x="682" y="113" width="16" height="44" fill="#3a2f26"/>
<rect x="656" y="121" width="26" height="28" fill="#6fbf4a"/>
<rect x="682" y="121" width="12" height="28" fill="#6fbf4a" opacity="0.25"/>
<rect x="682" y="113" width="16" height="44" fill="none" stroke="#d45d35" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="590" y="44" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="middle" font-weight="bold">3. The player</text>
