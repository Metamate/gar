<text x="105" y="108" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">hit</text>
<text x="105" y="123" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#d45d35" text-anchor="middle" font-weight="normal">mark</text>
<rect x="170" y="92" width="70" height="36" fill="#2e3338" rx="5" stroke="#d45d35" stroke-width="1.5"/>
<text x="205" y="108" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">hit</text>
<text x="205" y="123" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#d45d35" text-anchor="middle" font-weight="normal">mark</text>
<rect x="270" y="92" width="70" height="36" fill="#2e3338" rx="5" stroke="#d45d35" stroke-width="1.5"/>
<text x="305" y="108" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">hit</text>
<text x="305" y="123" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#d45d35" text-anchor="middle" font-weight="normal">mark</text>
<line x1="376" y1="110" x2="426" y2="110" stroke="#9aa3ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-9aa3ab)"/>
<rect x="432" y="76" width="250" height="68" fill="#14171a" rx="6" stroke="#7fd46b" stroke-width="1.5"/>
<text x="444" y="66" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#7fd46b" text-anchor="start" font-weight="normal">RemoveDestroyed</text>
<text x="557" y="108" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">destroy the marked bodies,</text>
<text x="557" y="126" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#dee2e6" text-anchor="middle" font-weight="normal">and take them off the list</text>
<text x="40" y="200" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dee2e6" text-anchor="start" font-weight="bold">Why not in the hit handler?</text>
<text x="40" y="228" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">The world is still reporting: a later hit may be about the body you just destroyed.</text>
<text x="40" y="245.55" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa3ab" text-anchor="start" font-weight="normal">And something may be looping over the list you would remove from.</text>
<text x="40" y="292" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7fd46b" text-anchor="start" font-weight="bold">Mark now, remove at a safe point.</text>
</svg>
