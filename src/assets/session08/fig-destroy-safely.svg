<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img"><title>Hits only mark entities as destroyed; they are removed after the physics step</title><defs><marker id="arrow-9aa3ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ab"/></marker></defs><rect width="720" height="320" rx="10" fill="#22262b"/>
<text x="40" y="44" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9aa3ab" text-anchor="start" font-weight="normal">one frame</text>
<rect x="40" y="76" width="330" height="68" fill="#14171a" rx="6" stroke="#2aa6a6" stroke-width="1.5"/>
<text x="52" y="66" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2aa6a6" text-anchor="start" font-weight="normal">Physics.Update: the step</text>
