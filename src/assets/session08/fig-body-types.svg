<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img"><title>Static bodies never move, kinematic bodies move as they are told, dynamic bodies are moved by physics</title><defs><marker id="arrow-d86ad6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d86ad6"/></marker><marker id="arrow-7fd46b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fd46b"/></marker></defs><rect width="720" height="280" rx="10" fill="#22262b"/>
